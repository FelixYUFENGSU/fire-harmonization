[project]
name = "fire-harmonization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "earthaccess>=0.17.0",
    "earthengine-api>=1.7.51",
    "folium>=0.20.0",
    "geemap>=0.37.2",
    "geopandas>=1.2.0",
    "h5py>=3.16.0",
    "marimo[recommended]>=0.25.2",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "rioxarray>=0.19.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "xarray>=2026.9.0",
]

[project.scripts]
fire-harmonization = "fire_harmonization:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
